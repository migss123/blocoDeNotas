<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloco de Notas Moderno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Bloco de Notas do Joédio</h1>
        <p>Suas anotações são salvas automaticamente no seu navegador.</p>

        <div class="actions">
            <div class="action-group">
                <button id="limparNota" type="button">Limpar nota</button>
                <button id="alternarTema" type="button">Modo escuro</button>
            </div>
            <span id="status" class="status" data-variant="info">Carregando...</span>
        </div>

        <textarea id="blocoDeNotas" placeholder="Comece a digitar aqui..."></textarea>
    </div>

    <script src="script.js"></script>
</body>
</html>
